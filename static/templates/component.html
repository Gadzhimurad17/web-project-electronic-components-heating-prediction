<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{.ComponentName}} — ТеплоКаталог</title>
    <link rel="stylesheet" href="/static/css/thermal.css">
</head>

<body>
    <div class="screen">

        <div class="topbar">
            <div class="topbar__brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M10 13.5V4a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z" />
                    <line x1="12" y1="7" x2="12" y2="12" />
                </svg>
                ТеплоКаталог
            </div>
            <div class="topbar__category">{{.ComponentType}}</div>
        </div>

        <section class="component-hero">
            <video class="component-hero__video" controls autoplay muted loop>
                <source src="{{.VideoURL}}" type="video/mp4">
                Ваш браузер не поддерживает видео.
            </video>

            <!-- Рейл как в TikTok: параметры + лайк, справа по центру -->
            <div class="component-rail">
                <span class="spec-chip">P: <b>{{.PowerDissipation}} Вт</b></span>
                <span class="spec-chip">RθJA: <b>{{.ThermalResistance}} °C/Вт</b></span>
                <span class="like" data-component-id="{{.ComponentID}}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M12 21s-6.7-4.3-9.3-8.2C.6 9.9 1.4 6 4.7 4.9c2-.6 4 .2 5.3 1.9 1.3-1.7 3.3-2.5 5.3-1.9 3.3 1.1 4.1 5 2 7.9C18.7 16.7 12 21 12 21z" />
                    </svg>
                    <span class="like-count">—</span>
                </span>
            </div>

            <!-- Кнопка «Далее» — в правом нижнем углу -->
            <a class="component-next" href="/component?id={{.ComponentID}}&next=true">
                Далее
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
            </a>

            <!-- Нижний оверлей с описанием — слева -->
            <div class="component-overlay">
                <h1 class="component-title">{{.ComponentName}}</h1>
                <p class="component-sub">{{.ComponentType}}</p>
                <p class="component-desc">
                    <span class="component-desc-short">{{.ComponentDescription}}</span>
                </p>
            </div>
        </section>

        <nav class="tabbar">
            <a href="/component?id=1" class="tab-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3" width="16" height="18" rx="3" />
                    <path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none" />
                </svg>
                Лента
            </a>
            <a href="/component/draft" class="tab-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 8v8M8 12h8" />
                </svg>
                Добавление
            </a>
            <a href="/catalog" class="tab-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="8" height="8" rx="1.5" />
                    <rect x="13" y="3" width="8" height="8" rx="1.5" />
                    <rect x="3" y="13" width="8" height="8" rx="1.5" />
                    <rect x="13" y="13" width="8" height="8" rx="1.5" />
                </svg>
                Плитка
            </a>
        </nav>

    </div>

    <script>
        document.querySelectorAll('[data-component-id]').forEach(async el => {
            const id = el.dataset.componentId;
            try {
                const r = await fetch(`/api/components/${id}/likes`);
                const data = await r.json();
                el.querySelector('.like-count').textContent = data.likes;
            } catch { el.querySelector('.like-count').textContent = 0; }
        });
    </script>
</body>

</html>
