services:
  minio:
    container_name: ${MINIO_CONTAINER_NAME}
    image: ${MINIO_IMAGE}
    ports:
      - "${MINIO_API_PORT}:${MINIO_API_CONTAINER_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_CONTAINER_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_CONSOLE_ADDRESS: ":${MINIO_CONSOLE_CONTAINER_PORT}"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":${MINIO_CONSOLE_CONTAINER_PORT}"
  postgres:
    container_name: ${POSTGRES_CONTAINER_NAME}
    image: ${POSTGRES_IMAGE}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    container_name: ${REDIS_CONTAINER_NAME}
    image: ${REDIS_IMAGE}
    ports:
      - "${REDIS_PORT}:6739"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
  adminer:
    container_name: ${ADMINER_CONTAINER_NAME}
    image: ${ADMINER_IMAGE}
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - postgres

volumes:
  minio-data:
  postgres-data:
  redis_data:
