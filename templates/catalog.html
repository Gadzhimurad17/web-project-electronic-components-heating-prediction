<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Каталог — ТеплоКаталог</title>
    <link rel="stylesheet" href="/static/css/thermal.css">
</head>

<body>
    <div class="screen">

        <div class="topbar on-light static">
            <div class="topbar__brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M10 13.5V4a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z" />
                    <line x1="12" y1="7" x2="12" y2="12" />
                </svg>
                ТеплоКаталог
            </div>
        </div>

        <div class="page flush-top">
            <h1 class="page-title">Каталог компонентов</h1>
            <p class="page-lead">Прогноз нагрева электронных компонентов — опубликованные карточки</p>

            <form class="filter-form" method="get" action="/catalog">
                <label class="filter-label">
                    Мин. мощность: <b id="powerValue">{{.MinPower}}</b> Вт
                    <input type="range" name="min_power" min="0" max="500" step="1" value="{{.MinPower}}"
                        oninput="document.getElementById('powerValue').textContent=this.value">
                </label>
                <button type="submit">Найти</button>
            </form>
            <p class="filter-note">Фильтр — по рас. мощности; значение сохраняется в URL.</p>

            <div class="grid">
                {{range .Components}}
                <a class="card" href="/component?id={{.ComponentID}}">
                    <div class="card__media">
                        <img src="{{.ImageURL}}" alt="{{.ComponentName}}" class="card__img">
                        <div class="card__quickview">Быстрый просмотр</div>
                    </div>
                    <div class="card__body">
                        <div class="card__cat">{{.ComponentType}}</div>
                        <p class="card__name">{{.ComponentName}}</p>
                        <div class="card__foot">
                            <span class="card__power">{{.PowerDissipation}} Вт</span>
                            <span class="card__likes" data-component-id="{{.ComponentID}}">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M12 21s-6.7-4.3-9.3-8.2C.6 9.9 1.4 6 4.7 4.9c2-.6 4 .2 5.3 1.9 1.3-1.7 3.3-2.5 5.3-1.9 3.3 1.1 4.1 5 2 7.9C18.7 16.7 12 21 12 21z" />
                                </svg>
                                <span class="like-count">—</span>
                            </span>
                        </div>
                    </div>
                </a>
                {{end}}
            </div>
        </div>

        <nav class="tabbar">
            <a href="/component?id=1" class="tab-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3" width="16" height="18" rx="3" />
                    <path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none" />
                </svg>
                Лента
            </a>
            <a href="/component/draft" class="tab-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 8v8M8 12h8" />
                </svg>
                Добавление
            </a>
            <a href="/catalog" class="tab-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="8" height="8" rx="1.5" />
                    <rect x="13" y="3" width="8" height="8" rx="1.5" />
                    <rect x="3" y="13" width="8" height="8" rx="1.5" />
                    <rect x="13" y="13" width="8" height="8" rx="1.5" />
                </svg>
                Плитка
            </a>
        </nav>

    </div>

    <script>
        document.querySelectorAll('[data-component-id]').forEach(async el => {
            const id = el.dataset.componentId;
            try {
                const r = await fetch(`/api/components/${id}/likes`);
                const data = await r.json();
                el.querySelector('.like-count').textContent = data.likes;
            } catch { el.querySelector('.like-count').textContent = 0; }
        });
    </script>
</body>

</html>
